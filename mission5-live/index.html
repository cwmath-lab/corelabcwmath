<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>화성 주권자 퀘스트 · 미션 5</title>
<style>
:root{--bg:#07111d;--panel:#10283d;--cyan:#5be6f4;--orange:#ff6e2f;--gold:#ffd26f;--cream:#fff7ec;--ink:#17283a;--muted:#cde2ed;--shadow:0 18px 50px #0007}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:radial-gradient(circle at 12% 12%,#7b2d1455,transparent 28%),radial-gradient(circle at 84% 8%,#ffb66033,transparent 20%),linear-gradient(145deg,#050d17,#102a40);color:#f6fbff;overflow:hidden}body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px),radial-gradient(circle,#63e7ff 1px,transparent 1.5px);background-size:100px 100px,150px 150px;background-position:0 0,45px 32px;opacity:.17;pointer-events:none}.hud{position:fixed;inset:0 0 auto;z-index:30;height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;background:#061521ee;border-bottom:1px solid #5be6f444;backdrop-filter:blur(10px)}.brand{font-weight:1000}.brand b{color:var(--orange)}.dots{display:flex;gap:7px}.dot{width:25px;height:9px;border-radius:10px;background:#29485f}.dot.on{background:linear-gradient(90deg,var(--orange),var(--gold));box-shadow:0 0 13px #ff824f}.screen{position:absolute;inset:70px 0 0;display:none;overflow:auto;padding:26px 24px 34px}.screen.on{display:block}.shell{width:min(1280px,100%);min-height:calc(100vh - 130px);margin:auto;display:flex;flex-direction:column;gap:18px}.tag{display:inline-flex;width:max-content;padding:9px 15px;border-radius:999px;background:#0a6570;border:1px solid #5be6f455;font-weight:900}.title{font-size:clamp(38px,5vw,70px);line-height:1.08;margin:4px 0}.accent{color:var(--orange)}.sub{font-size:clamp(17px,1.8vw,24px);line-height:1.65;color:var(--muted);margin:0}.panel{border-radius:28px;background:linear-gradient(145deg,#112d46ee,#091c2dee);border:1px solid #5be6f43d;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:18px}.intro{padding:26px}.intro h3{font-size:30px;color:#ffe1b9;margin:0 0 12px}.intro p{font-size:18px;line-height:1.72;margin:0}.mars-art{position:relative;min-height:310px;overflow:hidden;background:linear-gradient(#f69b5b,#a94420 50%,#17374d);border:2px solid #ff9e64;border-radius:28px}.mars-art:before{content:"";position:absolute;width:90px;height:90px;right:32px;top:28px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffb77d,#d94519 62%,#86250d);box-shadow:0 0 30px #ff7a3644}.base{position:absolute;left:30px;bottom:30px;width:155px;height:155px;border-radius:70px 70px 18px 18px;background:linear-gradient(#e8f2f5,#b9d1d8 48%,#173449 49%);border:3px solid #eafaff88}.base:before{content:"온기";position:absolute;top:52px;left:48px;font-weight:1000;color:#a43d1d;background:#fff6df;padding:5px 10px;border-radius:9px}.robot{position:absolute;right:54px;bottom:38px;width:145px;height:105px;border-radius:58px;background:linear-gradient(#fff,#cdd7df);border:2px solid #0002}.robot:before{content:"•  •";position:absolute;left:32px;top:22px;width:80px;height:44px;border-radius:24px;background:#10263a;color:#54e7ff;display:grid;place-items:center;letter-spacing:9px}.kids{position:absolute;left:210px;right:215px;bottom:25px;display:flex;gap:14px;justify-content:center}.kid{width:70px;height:135px;position:relative}.kid:before{content:"";position:absolute;left:12px;width:46px;height:46px;border-radius:50%;background:#ffd2b6;box-shadow:inset 0 13px #3b2418}.kid:after{content:"";position:absolute;left:8px;top:40px;width:54px;height:80px;border-radius:16px;background:#f5f7f8;border:3px solid #d45b24}.methods-title{text-align:center;font-size:clamp(28px,3vw,44px);margin:6px}.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.method{position:relative;min-height:310px;padding:22px;border-radius:26px;background:linear-gradient(#fffaf1,#ffedd6);color:var(--ink);border:4px solid var(--c);cursor:pointer;box-shadow:var(--shadow);transition:.18s}.method:hover{transform:translateY(-5px);filter:brightness(1.02)}.method .num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:24px;font-weight:1000}.method .ico{font-size:70px;text-align:center;margin:9px 0}.method h3{font-size:25px;margin:0 0 10px;color:var(--c)}.method p{font-size:17px;line-height:1.6;margin:0}.method small{display:block;margin-top:13px;color:#567080;font-weight:900}.center-actions{display:flex;justify-content:center}.btn{border:0;border-radius:16px;min-height:52px;padding:14px 20px;font-size:17px;font-weight:1000;color:#fff;background:#1a405f;cursor:pointer;transition:.18s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.next{background:linear-gradient(135deg,#ff913d,#d9431b)}.btn.prev{background:#294b67}.btn.example{background:linear-gradient(135deg,#087b82,#0b5961);font-size:19px;padding:15px 24px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:auto}.image-frame{display:flex;align-items:center;justify-content:center;padding:14px;background:#071521;border:7px solid var(--cyan);outline:3px solid var(--gold);outline-offset:-13px;border-radius:28px;box-shadow:var(--shadow);cursor:pointer}.image-frame img{display:block;width:100%;height:auto;max-height:76vh;object-fit:contain;border-radius:16px;background:#fff7ec}.hint{text-align:center;color:#ffe29c;font-weight:900}.success{text-align:center;position:relative}.success h2{font-size:clamp(42px,6vw,78px);margin:8px}.success p{font-size:clamp(19px,2.2vw,30px);line-height:1.7;max-width:1100px;margin:0 auto 16px}.id-frame{width:min(1100px,100%);margin:0 auto;display:flex;align-items:center;justify-content:center;padding:14px;background:#071521;border:7px solid var(--gold);border-radius:28px;box-shadow:var(--shadow)}.id-frame img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;border-radius:14px}.audio-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.fireworks{position:fixed;inset:70px 0 auto;height:220px;pointer-events:none;overflow:hidden}.fireworks span{position:absolute;font-size:70px;animation:pop 1.8s ease-in-out infinite}.fireworks span:nth-child(1){left:5%;top:30px}.fireworks span:nth-child(2){right:6%;top:10px;animation-delay:.5s}.fireworks span:nth-child(3){left:27%;top:5px;animation-delay:1s}.fireworks span:nth-child(4){right:28%;top:50px;animation-delay:1.35s}@keyframes pop{0%,100%{opacity:.25;transform:scale(.6) rotate(-8deg)}50%{opacity:1;transform:scale(1.2) rotate(7deg)}}.confetti{position:fixed;inset:70px 0 0;pointer-events:none;overflow:hidden}.piece{position:absolute;width:11px;height:18px;border-radius:3px;animation:fall 4.5s linear infinite}@keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(105vh) rotate(550deg)}}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:16px;background:#000c;backdrop-filter:blur(7px)}.modal.open{display:grid}.modal-box{width:min(1260px,98vw);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;border-radius:26px;background:#071827;border:2px solid #5be6f5;box-shadow:0 25px 70px #000}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 17px;background:#113650}.modal-view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:15px;overflow:auto}.modal-view img{display:block;width:100%;height:100%;max-height:78vh;object-fit:contain;border-radius:16px;background:#fff7ec}.modal-detail{padding:24px;color:#eef8ff}.modal-detail h3{font-size:32px;color:#ffd58a}.modal-detail p,.modal-detail li{font-size:18px;line-height:1.7}.modal-bottom{display:flex;justify-content:center;padding:0 18px 18px}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,25px);opacity:0;background:#fff;color:#142434;padding:12px 18px;border-radius:14px;z-index:130;transition:.22s;font-weight:900}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){html,body{overflow:auto}.screen{position:relative;min-height:calc(100vh - 70px)}.hero,.methods{grid-template-columns:1fr}.kids{left:120px;right:180px}.hud{position:absolute}.dots{display:none}.method{min-height:auto}.image-frame img,.id-frame img{max-height:none}}
</style>
</head>
<body>
<header class="hud"><div class="brand">🚀 화성 주권자 퀘스트 <b>MISSION 5</b></div><div class="dots" id="dots"></div><small id="status">1 / 3</small></header>
<main id="app"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-box"><div class="modal-head"><strong id="modalTitle">자세히 보기</strong><button class="btn" id="modalTopClose">닫기 ✕</button></div><div class="modal-view" id="modalView"></div><div class="modal-bottom"><button class="btn prev" id="modalBottomClose">닫기 · 원래 화면으로 돌아가기</button></div></div></div>
<div class="toast" id="toast"></div>
<audio id="celebration" preload="auto"></audio>
<script>
const app=document.getElementById('app'),dots=document.getElementById('dots'),status=document.getElementById('status'),modal=document.getElementById('modal'),modalTitle=document.getElementById('modalTitle'),modalView=document.getElementById('modalView'),celebration=document.getElementById('celebration'),toast=document.getElementById('toast');let cur=0,confettiMade=false;const A={book:'',plan:'',id:'',audio:''};async function loadB64(path,mime){const t=(await (await fetch(path)).text()).replace(/\s/g,'');const bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:mime}))}async function loadAssets(){app.innerHTML='<section class="screen on"><div class="shell" style="align-items:center;justify-content:center;text-align:center"><span class="tag">MISSION 5 LOADING</span><h1 class="title">수업 자료를 불러오고 있어요…</h1><p class="sub">잠시만 기다려 주세요.</p></div></section>';[A.book,A.plan,A.id,A.audio]=await Promise.all([loadB64('assets/book-example.b64','image/jpeg'),loadB64('assets/donation-plan.b64','image/jpeg'),loadB64('assets/citizen-id.b64','image/jpeg'),loadB64('assets/celebration.b64','audio/mpeg')]);celebration.src=A.audio;render()}
const details=[{title:'1. 스토리보드 구성',html:'<div class="modal-detail"><h3>🧩 핵심 장면을 골라 이야기로 만들어요.</h3><p>지금까지 활동한 미션을 돌아보고, 꼭 넣고 싶은 장면을 선택합니다.</p><ul><li>규칙이 사라진 화성의 문제</li><li>기본권 에너지를 되찾은 과정</li><li>헌법을 판단하고 바꾼 경험</li><li>우리가 지킬 온기 헌법의 약속</li></ul><p>장면의 순서를 정하고 인물, 대사, 설명을 간단히 적어 스토리보드를 완성해요.</p></div>'},{title:'2. 그림책 제작',html:'<div class="modal-detail"><h3>🎨 우리만의 온기 헌법 그림책을 만들어요.</h3><p>캔바, 미리캔버스, PPT 또는 종이와 색연필 등 다양한 도구를 이용할 수 있어요.</p><ul><li>글자는 크고 읽기 쉽게 쓰기</li><li>한 장면에는 한 가지 핵심 내용 담기</li><li>화성·헌법·기본권 이미지 함께 사용하기</li><li>친구들과 글·그림·편집 역할 나누기</li></ul></div>'},{title:'3. NFC 태그 연결',html:'<div class="modal-detail"><h3>📡 스마트 헌법 그림책을 NFC 태그로 연결해요.</h3><p>완성한 그림책의 소개 영상이나 낭독 영상을 NFC 태그에 연결하고 도서관에 기부합니다.</p><ul><li>NFC 태그가 잘 열리는지 확인하기</li><li>개인정보가 포함되지 않았는지 확인하기</li><li>1~4학년 친구들에게 책을 읽어 주기</li><li>퀴즈와 역할놀이로 헌법 수업 진행하기</li></ul></div>'}];
function page1(){return `<section class="screen on"><div class="shell"><span class="tag">MISSION 5 · PUBLISH & DONATE</span><h1 class="title"><span class="accent">[미션5]</span> 온기 헌법 그림책 출판 및 기부</h1><p class="sub">온기 헌법 그림책을 만들고 주변 사람들에게 기부해 봅시다.</p><div class="hero"><article class="panel intro"><h3>📚 헌법의 가치를 이야기로 나눠요</h3><p>지금까지 해결한 화성 헌법 미션을 그림책으로 만들고, 도서관과 후배 교실에 기부해요. 책을 읽어 주고 활동을 진행하면서 자유·권리·책임·민주적 참여의 의미를 더 많은 사람과 나눕니다.</p></article><div class="mars-art"><div class="base"></div><div class="kids"><div class="kid"></div><div class="kid"></div><div class="kid"></div></div><div class="robot"></div></div></div><h2 class="methods-title">온기 헌법 그림책 제작 방법</h2><div class="methods"><article class="method" style="--c:#0d8190" onclick="openDetail(0)"><div class="num">1</div><div class="ico">🧩</div><h3>스토리보드 구성</h3><p>핵심 장면을 골라 이야기로 만들어요.</p><small>클릭하면 자세히 볼 수 있어요 →</small></article><article class="method" style="--c:#d75b25" onclick="openDetail(1)"><div class="num">2</div><div class="ico">🎨</div><h3>그림책 제작</h3><p>캔바, 미리캔버스, PPT 등 다양한 도구로 우리만의 그림책을 만들어요.</p><small>클릭하면 자세히 볼 수 있어요 →</small></article><article class="method" style="--c:#7650a8" onclick="openDetail(2)"><div class="num">3</div><div class="ico">📡</div><h3>NFC 태그 연결</h3><p>스마트 그림책을 NFC 태그로 연결해 도서관에 기부하고 후배들에게 수업해요.</p><small>클릭하면 자세히 볼 수 있어요 →</small></article></div><div class="center-actions"><button class="btn example" onclick="openImage(A.book,'온기 헌법 그림책 예시')">📖 온기 그림책 예시 보기</button></div><div class="nav"><span></span><button class="btn next" onclick="go(1)">다음으로 ➜</button></div></div></section>`}
function page2(){return `<section class="screen on"><div class="shell"><span class="tag">DONATION PLAN</span><h1 class="title">기부 계획서 <span class="accent">작성하기</span></h1><p class="sub">기부 계획서 예시를 참고하여 자신의 온기 헌법 그림책 기부 계획을 작성해 봅시다.</p><div class="image-frame" onclick="openImage(A.plan,'온기 헌법 그림책 기부 계획서')"><img src="${A.plan}" alt="온기 헌법 그림책 기부 계획서"></div><div class="hint">🔎 이미지를 클릭하면 잘리지 않는 큰 화면으로 볼 수 있어요.</div><div class="nav"><button class="btn prev" onclick="go(0)">◀ 이전으로</button><button class="btn next" onclick="go(2);startSuccess()">다음으로 ➜</button></div></div></section>`}
function page3(){return `<section class="screen on success"><div class="fireworks"><span>🎆</span><span>🎇</span><span>✨</span><span>🎆</span></div><div class="confetti" id="confetti"></div><div class="shell"><span class="tag" style="margin:auto">MISSION COMPLETE · MARS DEMOCRATIC CITIZEN</span><h2><span class="accent">축하합니다!</span> 미션 성공!</h2><p id="successText">온기 헌법 프로젝트를 성공하였습니다! 모든 미션을 완료하였으므로 화성 민주 시민증을 수여합니다.</p><div class="id-frame" onclick="openImage(A.id,'화성 민주 시민증')"><img src="${A.id}" alt="화성 민주 시민증"></div><div class="audio-row"><button class="btn" onclick="readSuccess()">🔊 축하 메시지 읽기</button><button class="btn" onclick="playCelebration()">👏 박수·폭죽 다시 듣기</button><button class="btn prev" onclick="stopAll()">⏹ 모두 멈춤</button></div><div class="nav"><button class="btn prev" onclick="go(1)">◀ 이전으로</button><span></span></div></div></section>`}
function render(){dots.innerHTML=[0,1,2].map(i=>`<i class="dot ${i===cur?'on':''}"></i>`).join('');status.textContent=`${cur+1} / 3`;app.innerHTML=cur===0?page1():cur===1?page2():page3();if(cur===2)setTimeout(startSuccess,80)}function go(n){stopSpeech();cur=Math.max(0,Math.min(2,n));render();scrollTo(0,0)}function openDetail(i){modalTitle.textContent=details[i].title;modalView.innerHTML=details[i].html;modal.classList.add('open')}function openImage(src,title){modalTitle.textContent=title;modalView.innerHTML=`<img src="${src}" alt="${title}">`;modal.classList.add('open')}function closePop(){modal.classList.remove('open');modalView.innerHTML=''}document.getElementById('modalTopClose').onclick=closePop;document.getElementById('modalBottomClose').onclick=closePop;modal.onclick=e=>{if(e.target===modal)closePop()};addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});function voice(){return speechSynthesis.getVoices().find(v=>/ko|Korean|한국/i.test(v.lang+' '+v.name))||null}function readSuccess(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(document.getElementById('successText').textContent);u.lang='ko-KR';u.rate=.92;u.pitch=.9;const v=voice();if(v)u.voice=v;speechSynthesis.speak(u)}function stopSpeech(){speechSynthesis.cancel()}async function playCelebration(){try{celebration.currentTime=0;celebration.volume=.78;await celebration.play()}catch(e){showToast('소리 재생 버튼을 다시 눌러 주세요.')}}function stopAll(){speechSynthesis.cancel();celebration.pause();celebration.currentTime=0}function startSuccess(){makeConfetti();playCelebration()}function makeConfetti(){const f=document.getElementById('confetti');if(!f||f.children.length)return;const cs=['#5be6f4','#ffd26f','#ff6e2f','#8f71ff','#69df87','#ff84b5'];for(let i=0;i<42;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.background=cs[i%cs.length];p.style.animationDuration=3.5+Math.random()*4+'s';p.style.animationDelay=Math.random()*2+'s';f.appendChild(p)}}function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1500)}window.go=go;window.openDetail=openDetail;window.openImage=openImage;window.readSuccess=readSuccess;window.playCelebration=playCelebration;window.stopAll=stopAll;window.startSuccess=startSuccess;loadAssets().catch(e=>{app.innerHTML='<section class="screen on"><div class="shell"><h1 class="title">자료를 불러오지 못했습니다.</h1><p class="sub">인터넷 연결을 확인한 뒤 새로고침해 주세요.</p></div></section>';console.error(e)});
</script>
</body>
</html>

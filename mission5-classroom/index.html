<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미션 5 불러오는 중</title><style>html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#76301855,transparent 25%),linear-gradient(145deg,#06101b,#112b40);color:#fff;font-family:"Malgun Gothic",system-ui,sans-serif;text-align:center;padding:24px}h1{color:#ffd26f}p{color:#cde2ed}</style></head><body><main><h1>🚀 미션 5 웹앱을 불러오고 있어요…</h1><p>잠시만 기다려 주세요.</p></main><script>(async()=>{try{const names=['00','01','02','03'];const parts=await Promise.all(names.map(n=>fetch(`chunks/${n}.txt?v=1`).then(r=>{if(!r.ok)throw new Error(`자료 ${n}을 불러오지 못했습니다.`);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<main><h1>자료를 불러오지 못했습니다.</h1><p>인터넷 연결을 확인한 뒤 새로고침해 주세요.</p></main>'}})();</script></body></html>

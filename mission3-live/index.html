<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>화성 주권자 퀘스트 · 미션 3</title><style>:root{--bg:#07111d;--p:#102b43;--c:#55e6f5;--o:#ff7138;--g:#ffd16e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 8%,#63281455,transparent 25%),linear-gradient(145deg,#050d17,#10283d);color:#f5fbff;font-family:"Malgun Gothic",system-ui,sans-serif;overflow:hidden}.hud{height:64px;position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#071522ee;border-bottom:1px solid #55e6f555}.brand{font-weight:900}.brand b{color:var(--o)}#dots{display:flex;gap:5px}.dot{width:18px;height:8px;border-radius:9px;background:#29485e}.dot.on{background:linear-gradient(90deg,var(--o),var(--g));box-shadow:0 0 10px #ff8d45}.screen{position:absolute;inset:64px 0 0;display:none;overflow:auto;padding:24px}.screen.on{display:block}.shell{width:min(1280px,100%);min-height:calc(100vh - 112px);margin:auto;display:flex;flex-direction:column;gap:18px}.tag{display:inline-block;background:#0c5965;border:1px solid #55e6f577;border-radius:999px;padding:8px 14px;font-weight:900}h1,h2{margin:7px 0;line-height:1.12}h1{font-size:clamp(38px,5vw,68px)}h2{font-size:clamp(30px,4vw,54px)}.accent{color:var(--o)}.sub{color:#cce4ee;font-size:clamp(16px,1.6vw,21px);line-height:1.65}.panel{background:linear-gradient(145deg,#112d46ee,#091c2dee);border:1px solid #55e6f544;border-radius:26px;box-shadow:0 18px 45px #0007}.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}.art{min-height:500px;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(#e66a35,#6f2918 48%,#10283a);border:2px solid #ff874d;border-radius:28px}.art:before{content:"⚖️  📜";position:absolute;top:25px;left:30px;font-size:54px}.tower{font-size:140px;filter:drop-shadow(0 15px 8px #0008)}.story{padding:25px;font-size:19px;line-height:1.75}.law{padding:20px;background:#4b140e;border:2px solid #ff6530;border-radius:18px;color:#fff4e9;font-weight:800}.navrow{margin-top:auto;display:flex;justify-content:space-between;gap:12px}.btn{border:0;border-radius:16px;padding:14px 20px;min-height:52px;color:#fff;font-weight:900;font-size:17px;cursor:pointer;background:#183b58}.btn.next{background:linear-gradient(135deg,#ff8a34,#d84018)}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1}.card{padding:22px;border-radius:22px;background:#fff7eb;color:#10263a;border:4px solid var(--x,#16849b)}.card h3{color:var(--x);margin:0 0 8px}.check{width:32px;height:32px;accent-color:var(--x)}.criterion{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.criterion .card{font-size:17px;line-height:1.55}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.role{text-align:center}.role .ico{font-size:86px;background:linear-gradient(#e66a35,#14374c);border-radius:18px;padding:25px}.role p{line-height:1.6}.imagebox{flex:1;min-height:430px;border:7px solid var(--c);outline:3px solid var(--g);outline-offset:-14px;border-radius:28px;padding:18px;background:#05111d;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 30px #55e6f533}.imagebox img{width:100%;height:100%;max-height:590px;object-fit:contain;border-radius:15px;background:#fff}.hint{text-align:center;color:#ffd789;font-weight:900}.success{text-align:center}.success h2{font-size:clamp(40px,6vw,72px)}.rev{display:grid;grid-template-columns:1fr 70px 1fr;gap:15px;align-items:center}.seal{display:inline-block;padding:12px 22px;border-radius:999px;background:#087174;border:2px solid #7df4ef;color:#fff6b9;font-size:22px;font-weight:900;animation:pulse 1.4s infinite}.fire{font-size:56px;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.25)}}.audio{display:flex;gap:10px;flex-wrap:wrap}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:15px;background:#000c;backdrop-filter:blur(6px)}.modal.open{display:flex}.mbox{width:min(1200px,97vw);height:min(92vh,900px);display:flex;flex-direction:column;background:#071827;border:2px solid #55e6f5;border-radius:24px;overflow:hidden}.mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#123650}.mview{flex:1;min-height:0;padding:16px;display:flex;align-items:center;justify-content:center;overflow:auto}.mview img{display:block;width:100%;height:100%;object-fit:contain;background:#fff;border:6px solid #55e6f5;border-radius:16px}@media(max-width:850px){body{overflow:auto}.screen{position:relative;min-height:calc(100vh - 64px)}.hero,.grid2,.roles,.rev{grid-template-columns:1fr}.criterion{grid-template-columns:1fr}.art{min-height:360px}.hud #dots{display:none}}</style></head><body><header class="hud"><div class="brand">🚀 화성 주권자 퀘스트 <b>MISSION 3</b></div><div id="dots"></div><small id="state">음향 준비</small></header><main id="app"></main><div class="modal" id="modal"><div class="mbox"><div class="mhead"><b id="mtitle">자료 크게 보기</b><button class="btn" id="mclose">닫기 ✕</button></div><div class="mview"><img id="mimg" alt="확대 자료"></div></div></div><script>const data=[{tag:'MISSION 3 · EMERGENCY REVIEW',title:'과잉금지 원칙으로 <span class="accent">법률을 검토하라!</span>',sub:'모의 헌법심사를 통해 기본권 제한 규정의 타당성을 판단해 봅시다.',body:'<div class="hero"><div class="art"><div class="tower">🚨🏢</div></div><article class="panel story"><h3>긴급 시나리오</h3><p>타이탄 모래폭풍으로 식량이 부족해질 위험이 생기자 사령관이 <b class="accent">아레스 기지 비상 법령 제3호</b>를 선포했습니다.</p><div class="law">모든 시민은 하루에 알약 한 개만 먹어야 하며, 개인 간식을 숨겨 먹으면 공동시설을 이용할 수 없다.</div><div class="audio"><button class="btn" onclick="music()">🎵 배경음</button><button class="btn" onclick="speak(0)">🔊 읽기</button><button class="btn" onclick="stopAll()">⏹ 멈춤</button></div></article></div>'},{tag:'THINKING QUESTIONS',title:'생각 열기 질문',sub:'네 가지 기준을 바탕으로 규정이 공정한지 생각해 봅시다.',body:'<div class="grid2">'+[['🎯','목적의 정당성','식량 절약 목적은 정당한가요?','#16849b'],['🧩','수단의 적합성','모두에게 같은 제한이 적절한가요?','#d76428'],['🛡️','침해의 최소성','권리를 덜 제한하는 방법은 없나요?','#4e8a3b'],['⚖️','법익의 균형성','공동체 이익과 불이익이 균형적인가요?','#76509e']].map(x=>`<label class="card" style="--x:${x[3]}"><h3>${x[0]} ${x[1]}</h3><p>${x[2]}</p><input class="check" type="checkbox"></label>`).join('')+'</div>'},{tag:'CONSTITUTION ARTICLE 37(2)',title:'대한민국 헌법 제37조 제2항',sub:'기본권 제한은 필요한 경우에만 가능하며 본질적인 내용을 침해할 수 없습니다.',body:'<div class="hero"><div class="art"><div class="tower">🏛️⚖️</div></div><article class="card" style="--x:#b76b34;font-size:clamp(22px,2.4vw,36px);line-height:1.75">국민의 자유와 권리는 국가안전보장, 질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 제한할 수 있으며, 제한하는 경우에도 자유와 권리의 본질적인 내용을 침해할 수 없다.</article></div>'},{tag:'INDIVIDUAL REVIEW',title:'비상 법령 제3호를 심사하라!',sub:'과잉금지원칙 4단계에 따라 개인의 생각을 정리합니다.',body:'<div class="criterion">'+['1. 목적의 정당성','2. 수단의 적합성','3. 침해의 최소성','4. 법익의 균형성'].map((x,i)=>`<div class="card" style="--x:${['#16849b','#d76428','#4e8a3b','#76509e'][i]}"><h3>${x}</h3><p>규정의 목적과 방법, 권리 제한 정도와 공동체 이익의 균형을 살펴보세요.</p></div>`).join('')+'</div>'},{tag:'GROUP DELIBERATION',title:'함께 생각하고 판단해요!',sub:'모둠 친구들과 근거를 들어 의견을 나눕니다.',body:'<div class="grid2"><div class="panel story"><h3>🛰️ 토론 방법</h3><p>① 내 생각 정리하기<br>② 돌아가며 말하기<br>③ 네 가지 기준 살펴보기<br>④ 모둠 의견 정리하기<br>⑤ 발표하고 성찰하기</p></div><div class="panel story"><h3>💛 토론 약속</h3><p>친구 말을 끊지 않아요.<br>이유를 들어 말해요.<br>다른 의견도 존중해요.<br>학습지에 함께 정리해요.</p></div></div>'},{tag:'MOCK CONSTITUTIONAL REVIEW',title:'모의 헌법심사를 해요!',sub:'역할을 나누어 시민 측, 규정 제정 측, 헌법심사위원의 관점으로 판단합니다.',body:'<div class="roles">'+[['🧑‍🚀📢','시민 측 의견 제시자'],['👩‍🚀📜','규정 제정 측 의견 제시자'],['🧑‍⚖️⚖️','헌법심사위원']].map(x=>`<div class="card role"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><p>근거를 들어 설명하고 질문하며 공정하게 판단합니다.</p></div>`).join('')+'</div>'},{tag:'SCREEN 7 · REVIEW PROCESS',title:'위헌법률심판 과정',sub:'그림을 클릭하면 모든 내용이 보이는 팝업으로 확대됩니다.',img:'process',label:'법원과 헌법재판소의 역할'},{tag:'SCREEN 8 · WORKSHEET',title:'과잉금지원칙 심사표',sub:'그림을 클릭하면 사각형 비율에 맞춘 전체 자료가 표시됩니다.',img:'worksheet',label:'과잉금지원칙 4단계 학습지'},{tag:'SCREEN 9 · JUDGMENT',title:'헌법 판단서 예시',sub:'그림을 클릭하면 잘리지 않은 전체 판단서를 확인할 수 있습니다.',img:'judgment',label:'모의 헌법 판단서'},{tag:'MISSION COMPLETE',title:'축하합니다! <span class="accent">미션 성공!</span>',sub:'여러분은 화성 공동체의 권리를 지켜 낸 어린이 헌법심사위원입니다.',body:'<div class="success"><div class="fire">🎆✨🎇✨🎆</div><span class="seal">CONSTITUTIONAL REVIEW COMPLETE</span><div class="rev"><div class="card" style="--x:#d84b2e"><h3>수정 전</h3><p><s>모든 시민에게 똑같은 식량 제한과 공동시설 이용 금지</s></p></div><div style="font-size:60px">➡️</div><div class="card" style="--x:#35b47b"><h3>수정 후</h3><p>건강 상태와 필요량을 고려하고, 권리를 덜 제한하는 방법을 사용합니다.</p></div></div><div class="audio" style="justify-content:center"><button class="btn" onclick="speak(9)">🔊 축하 메시지 읽기</button><button class="btn" onclick="celebrate()">👏 축하 소리</button><button class="btn" onclick="stopAll()">⏹ 모두 멈춤</button></div></div>'}];let cur=0,ctx=null,osc=[];const app=document.getElementById('app'),dots=document.getElementById('dots');dots.innerHTML=data.map((_,i)=>`<span class="dot" data-i="${i}"></span>`).join('');function svg(kind){const title={process:'위헌법률심판 과정',worksheet:'과잉금지원칙 4단계 심사표',judgment:'헌법 판단서 예시'}[kind];const rows=kind==='process'?['1. 법원에 재판 중인 사건','2. 위헌 여부가 재판의 전제가 됨','3. 법원이 헌법재판소에 제청','4. 헌법재판소가 위헌 여부 판단']:kind==='worksheet'?['목적의 정당성','수단의 적합성','침해의 최소성','법익의 균형성']:['사건과 쟁점','양측의 주장','과잉금지원칙 심사','최종 판단과 수정 의견'];return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#fff8ea"/><stop offset="1" stop-color="#e9f7fb"/></linearGradient></defs><rect width="1600" height="900" rx="36" fill="url(#b)"/><rect x="30" y="30" width="1540" height="840" rx="30" fill="none" stroke="#0c6774" stroke-width="14"/><text x="800" y="120" text-anchor="middle" font-size="64" font-weight="bold" fill="#b93e1b">${title}</text><text x="800" y="190" text-anchor="middle" font-size="32" fill="#153b50">화성 주권자 퀘스트 · 미션 3</text>${rows.map((r,i)=>`<rect x="180" y="${245+i*135}" width="1240" height="105" rx="24" fill="#fff" stroke="${['#16849b','#d76428','#4e8a3b','#76509e'][i]}" stroke-width="6"/><circle cx="245" cy="${298+i*135}" r="34" fill="${['#16849b','#d76428','#4e8a3b','#76509e'][i]}"/><text x="245" y="310" text-anchor="middle" font-size="30" fill="white">${i+1}</text><text x="310" y="312" font-size="38" font-weight="bold" fill="#18334a">${r}</text>`).join('')}<text x="800" y="830" text-anchor="middle" font-size="28" fill="#b05c2b">⚖️ 기본권을 존중하는 공정한 판단</text></svg>`)}function render(){app.innerHTML=data.map((d,i)=>`<section class="screen ${i===cur?'on':''}"><div class="shell"><div><span class="tag">${d.tag}</span><h${i?2:1}>${d.title}</h${i?2:1}><p class="sub">${d.sub}</p></div>${d.img?`<div class="imagebox" data-img="${d.img}" data-title="${d.label}"><img src="${svg(d.img)}" alt="${d.label}"></div><div class="hint">👆 그림을 클릭해 전체 화면으로 크게 보기</div>`:d.body}<div class="navrow">${i?'<button class="btn" onclick="go('+(i-1)+')">← 이전으로</button>':'<span></span>'}${i<data.length-1?'<button class="btn next" onclick="go('+(i+1)+')">다음으로 →</button>':'<button class="btn" onclick="go(0)">처음으로 ↺</button>'}</div></div></section>`).join('');document.querySelectorAll('.dot').forEach((x,i)=>x.classList.toggle('on',i===cur));document.querySelectorAll('.imagebox').forEach(x=>x.onclick=()=>openImg(x.dataset.img,x.dataset.title));if(cur===9)celebrate()}function go(n){stopAll();cur=n;render();scrollTo(0,0)}function openImg(k,t){document.getElementById('mtitle').textContent=t;document.getElementById('mimg').src=svg(k);document.getElementById('modal').classList.add('open')}mclose.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});function ac(){return ctx||(ctx=new (AudioContext||webkitAudioContext)())}function tone(f,d,v=.08,delay=0){const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,c.currentTime+delay);g.gain.linearRampToValueAtTime(v,c.currentTime+delay+.1);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d);osc.push(o)}function music(){stopAudio();[110,165,220].forEach((f,i)=>tone(f,6,.035,i*.12));state.textContent='배경음 재생 중'}function celebrate(){stopAudio();[523,659,784,1046].forEach((f,i)=>tone(f,.8,.08,i*.18));state.textContent='축하 효과 재생'}function speak(i){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((data[i].title+' '+data[i].sub).replace(/<[^>]+>/g,''));u.lang='ko-KR';u.rate=.86;u.pitch=.78;speechSynthesis.speak(u);state.textContent='음성 읽기 중'}function stopAudio(){osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[]}function stopAll(){speechSynthesis.cancel();stopAudio();state.textContent='음향 준비'}render();</script></body></html>
